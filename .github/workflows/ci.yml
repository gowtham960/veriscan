name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: pytest tests/ -v
        env:
          # Intentionally NOT setting GROQ_API_KEY / TAVILY_API_KEY / LANGSMITH_API_KEY —
          # the test suite is designed to run entirely against fallback/stub paths so it
          # needs no secrets. This tests graph wiring, security, resilience, and
          # persistence logic, not real third-party API responses.
          PYTHONUNBUFFERED: "1"
